---
global:
  namespace: argocd
  defaultCluster: https://kubernetes.default.svc
  clusterName: non-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
  defaultRepositories:
    - url: 'git@github.com:polarpoint-io**'
    - url: 'https://argoproj.github.io/argo-helm'
    - url: 'https://polarpoint-io.github.io/charts'
    - url: 'https://polarpoint-io.github.io/**'
    - url: 'https://pkgs.tailscale.com/helmcharts'
    - url: 'https://charts.crossplane.io/stable'
    - url: 'ghcr.io/stacklok/toolhive'
    - url: 'https://charts.jetstack.io'
    - url: 'https://backstage.github.io/charts'
    - url: 'https://go.temporal.io/helm-charts/'
    - url: 'ghcr.io/akuity/kargo-charts'
    - url: 'https://charts.bitnami.com/bitnami'
    - url: 'ghcr.io/stacklok/toolhive-registry-server'
    - url: 'ghcr.io/stacklok'
    - url: 'ghcr.io/intuitem/helm-charts/ce'
    - url: 'https://robusta-charts.storage.googleapis.com'
    - url: 'https://percona.github.io/percona-helm-charts/'

privateGitCredentialsTemplates:
  - name: polarpoint-io
    url: "git@github.com:polarpoint-io/"

privateHelmCredentialsTemplates: []

privateGitRepositories: []

publicHelmRepositories:
  - name: argo-helm
    url: "https://argoproj.github.io/argo-helm"
  - name: stacklok-toolhive
    url: "ghcr.io/stacklok/toolhive"
    enableOCI: true
  - name: temporal-repo
    url: "https://go.temporal.io/helm-charts/"
  - name: akuity-kargo-charts
    url: "ghcr.io/akuity/kargo-charts"
    enableOCI: true
  - name: bitnami
    url: "https://charts.bitnami.com/bitnami"
  - name: stacklok-toolhive-registry-server
    url: "ghcr.io/stacklok"
    enableOCI: true
  - name: intuitem-helm-charts
    url: "ghcr.io/intuitem/helm-charts/ce"
    enableOCI: true
  - name: robusta-charts
    url: "https://robusta-charts.storage.googleapis.com"
  - name: percona-helm-charts
    url: "https://percona.github.io/percona-helm-charts/"

privateHelmRepositories: []

clusters:
  - name: deploy
    url: https://kubernetes.default.svc
    local: true
    labels:
      env: non-prod
      role: deploy
  - name: tooling
    url: "https://192.168.11.80:6443"
    labels:
      env: non-prod
      role: tooling
  - name: multitenant
    url: "https://192.168.11.63:6443"
    labels:
      env: non-prod
      role: multitenant

projects:
  - name: argocd-config
    permissions:
      admin:
        description: "Admin Access"
        groups:
          - polarpoint-argocd-admin
      rw:
        description: "Read-Write Access"
        groups:
          - polarpoint-argocd-rw
      ro:
        description: "Read-Only Access"
        groups:
          - polarpoint-argocd-ro
    destinations:
      - name: default
        namespace: "*"
        server: https://kubernetes.default.svc
    applications: []

  - name: foundational
    permissions:
      admin:
        description: "Admin Access"
        groups:
          - polarpoint-argocd-admin
      rw:
        description: "Read-Write Access"
        groups:
          - polarpoint-argocd-rw
      ro:
        description: "Read-Only Access"
        groups:
          - polarpoint-argocd-ro
    destinations:
      - name: default
        namespace: "*"
        server: https://kubernetes.default.svc
      - name: tooling
        namespace: "*"
        server: https://192.168.11.80:6443
      - name: multitenant
        namespace: "*"
        server: https://192.168.11.63:6443
    # The three foundational parents are gone. Each was an Application whose
    # rendered output was more Application specs - one per cluster, differing only
    # in which global-values file it passed. All three are now (project=foundational,
    # env=..., destination=...) rows in the descriptors ApplicationSet, declared in
    # polarpoint-io/argocd-applications and applied by the argocd-applicationsets
    # Application in argocd-core/templates.
    applications: []

  - name: controller
    permissions:
      admin:
        description: "Admin Access"
        groups:
          - polarpoint-argocd-admin
      rw:
        description: "Read-Write Access"
        groups:
          - polarpoint-argocd-rw
      ro:
        description: "Read-Only Access"
        groups:
          - polarpoint-argocd-ro
    destinations:
      - name: default
        namespace: "*"
        server: https://kubernetes.default.svc
    # Replaced by the descriptors ApplicationSet - see the foundational note above.
    applications: []

  - name: tooling
    permissions:
      admin:
        description: "Admin Access"
        groups:
          - polarpoint-argocd-admin
      rw:
        description: "Read-Write Access"
        groups:
          - polarpoint-argocd-rw
      ro:
        description: "Read-Only Access"
        groups:
          - polarpoint-argocd-ro
    destinations:
      - name: default
        namespace: "*"
        server: https://kubernetes.default.svc
      - name: tooling
        namespace: "*"
        server: https://192.168.11.80:6443
      # Workloads that have to run on multitenant belong here, not in the
      # foundational project - foundational is for the per-cluster baseline
      # every cluster gets (cert-manager, external-secrets, tailscale-operator,
      # the observability and security stacks), not for one-off applications
      # that happen to need a particular cluster.
      - name: multitenant
        namespace: "*"
        server: https://192.168.11.63:6443
    # Replaced by the descriptors ApplicationSet - see the foundational note above.
    #
    # The kargo.akuity.io/authorized-stage annotation that used to live on the
    # multitenant parent has moved onto the ciso-assistant descriptor itself. It was
    # here because a promotion had to sync the parent before the child could pick up
    # its new targetRevision; with no parent in the path, Kargo syncs the app it
    # actually promotes.
    applications: []
