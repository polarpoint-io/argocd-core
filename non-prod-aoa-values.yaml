# The environment these declarations describe. Used for the `env` label on every
# generated Application, so it has to match the cluster suffix convention.
environment: non-prod

global:
  namespace: argocd
  # Values files for upstream charts live in argocd-applications under
  # <concern>/<app>/<env>/, referenced as $values by multi-source Applications.
  # An env folder is what lets prod differ from non-prod without a second chart.
  valuesRepo: git@github.com:polarpoint-io/argocd-applications.git
  valuesRevision: main
  defaultCluster: https://kubernetes.default.svc
  clusterName: non-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
  defaultRepositories:
  - url: 'git@github.com:polarpoint-io**'
  - url: 'https://argoproj.github.io/argo-helm'
  - url: 'https://polarpoint-io.github.io/charts'
  - url: 'https://polarpoint-io.github.io/**'
  - url: 'https://pkgs.tailscale.com/helmcharts'
  - url: 'https://charts.crossplane.io/stable'
  - url: 'ghcr.io/stacklok/toolhive'
  - url: 'https://charts.jetstack.io'
  - url: 'https://backstage.github.io/charts'
  - url: 'https://go.temporal.io/helm-charts/'
  - url: 'ghcr.io/akuity/kargo-charts'
  - url: 'https://charts.bitnami.com/bitnami'
  - url: 'ghcr.io/stacklok/toolhive-registry-server'
  - url: 'ghcr.io/stacklok'
  - url: 'ghcr.io/intuitem/helm-charts/ce'
  - url: 'https://robusta-charts.storage.googleapis.com'
  - url: 'https://percona.github.io/percona-helm-charts/'
  - url: 'https://charts.external-secrets.io'
  - url: 'https://prometheus-community.github.io/helm-charts'
  - url: 'https://grafana.github.io/helm-charts'
  - url: 'https://falcosecurity.github.io/charts'

privateGitCredentialsTemplates:
- name: polarpoint-io
  url: "git@github.com:polarpoint-io/"

privateHelmCredentialsTemplates: []

privateGitRepositories: []

publicHelmRepositories:
- name: argo-helm
  url: "https://argoproj.github.io/argo-helm"
- name: stacklok-toolhive
  url: "ghcr.io/stacklok/toolhive"
  enableOCI: true
- name: temporal-repo
  url: "https://go.temporal.io/helm-charts/"
- name: akuity-kargo-charts
  url: "ghcr.io/akuity/kargo-charts"
  enableOCI: true
- name: bitnami
  url: "https://charts.bitnami.com/bitnami"
- name: stacklok-toolhive-registry-server
  url: "ghcr.io/stacklok"
  enableOCI: true
- name: intuitem-helm-charts
  url: "ghcr.io/intuitem/helm-charts/ce"
  enableOCI: true
- name: robusta-charts
  url: "https://robusta-charts.storage.googleapis.com"
- name: percona-helm-charts
  url: "https://percona.github.io/percona-helm-charts/"
- name: external-secrets
  url: "https://charts.external-secrets.io"
- name: prometheus-community
  url: "https://prometheus-community.github.io/helm-charts"
- name: grafana
  url: "https://grafana.github.io/helm-charts"
- name: falcosecurity
  url: "https://falcosecurity.github.io/charts"

privateHelmRepositories: []

clusters:
- name: deploy
  url: https://kubernetes.default.svc
  local: true
  labels:
    env: non-prod
    role: deploy
- name: tooling
  url: "https://192.168.11.80:6443"
  labels:
    env: non-prod
    role: tooling
- name: multitenant
  url: "https://192.168.11.63:6443"
  labels:
    env: non-prod
    role: multitenant

projects:
- name: argocd-config
  permissions:
    admin:
      description: "Admin Access"
      groups:
      - polarpoint-argocd-admin
    rw:
      description: "Read-Write Access"
      groups:
      - polarpoint-argocd-rw
    ro:
      description: "Read-Only Access"
      groups:
      - polarpoint-argocd-ro
  destinations:
  - name: default
    namespace: "*"
    server: https://kubernetes.default.svc
  applications:
  - name: argocd-manifests-non-prod
    appLabel: argocd
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    targetRevision: v2.1.0
    namespace: argocd
    labels:
      service: argocd-config
    values: |
      certificates:
        - name: argocd-server-tls
          namespace: argocd
          host: deploy.polarpoint.io

- name: foundational
  permissions:
    admin:
      description: "Admin Access"
      groups:
      - polarpoint-argocd-admin
    rw:
      description: "Read-Write Access"
      groups:
      - polarpoint-argocd-rw
    ro:
      description: "Read-Only Access"
      groups:
      - polarpoint-argocd-ro
  destinations:
  - name: default
    namespace: "*"
    server: https://kubernetes.default.svc
  - name: tooling
    namespace: "*"
    server: https://192.168.11.80:6443
  - name: multitenant
    namespace: "*"
    server: https://192.168.11.63:6443

  # Every cluster the foundational baseline is installed on. Adding a cluster here
  # installs the whole baseline on it - that is the point of expressing foundational
  # as ApplicationSets rather than as one entry per cluster. `short` is the cluster's
  # own name, used where a value differs only by cluster (tailscale's hostname).
  clusters:
  - name: non-prod
    short: controller
    server: https://kubernetes.default.svc
  - name: non-prod-tooling
    short: tooling
    server: https://192.168.11.80:6443
  - name: non-prod-multitenant
    short: multitenant
    server: https://192.168.11.63:6443
  applicationSets:

  # ---- common -------------------------------------------------------------
  # External Secrets Operator. Every ExternalSecret in the estate depends on it,
  # and until now it was installed by hand with plain Helm on all three clusters
  # and tracked by nothing - so a rebuilt cluster would not have reproduced it.
  #
  # The clusters had drifted apart: controller and tooling on 2.6.0, multitenant
  # already on 2.8.0. Pinned to 2.8.0 because adoption has to pick one, and the
  # only alternative was downgrading multitenant across a CRD boundary.
  #
  # installCRDs matches what the hand-installed release actually used - recovered
  # from its Helm release secret rather than guessed - so the only intended change
  # on controller and tooling is the version itself.
  - name: external-secrets
    url: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    namespace: external-secrets
    # The hand-installed release is named "external-secrets", so its objects are
    # external-secrets, -webhook, -cert-controller. Without pinning this, ArgoCD
    # would use the Application name (external-secrets-non-prod-tooling and so on)
    # and render a second, parallel operator instead of adopting this one.
    releaseName: external-secrets
    labels:
      service: foundational
    # ESO's CRDs are large enough that a client-side apply exceeds the 262144-byte
    # last-applied-configuration annotation limit and fails. Server-side apply has
    # no such limit. 2.6.0 -> 2.8.0 is additive - two new generator CRDs, nothing
    # removed - so the upgrade itself is forward-only.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    valuesPath: foundational/common/external-secrets/non-prod/values.yaml

  # ---- security -----------------------------------------------------------
  - name: cert-manager
    url: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    namespace: cert-manager
    labels:
      service: foundational
    values: |
      crds:
        enabled: true

  # The argocd-server Certificate used to live in this chart, which is why there
  # were three per-cluster copies of it. It now belongs to argocd-manifests in the
  # argocd-config project, so what is left is identical on every cluster.
  - name: cert-manager-manifests
    appLabel: cert-manager
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    targetRevision: v2.1.0
    namespace: cert-manager
    labels:
      service: foundational
    values: |
      externalSecrets:
        - secretName: route53-credentials
          namespace: cert-manager
          refreshInterval: 5m
          data:
            - {secretKey: secret-access-key, remoteRef: {key: route53-credentials, property: secret-access-key}}
      customResources:
        - apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-dns01
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: surj@polarpoint.io
              privateKeySecretRef:
                name: letsencrypt-dns01-account
              solvers:
                - dns01:
                    route53:
                      region: eu-west-1
                      hostedZoneID: ZND0T184EWHJG
                      accessKeyID: AKIA4FNGZSXLDQERDR5O
                      secretAccessKeySecretRef:
                        name: route53-credentials
                        key: secret-access-key
  # ---- security -----------------------------------------------------------
  # Runtime threat detection, one agent per node. falcosidekick is off until
  # there is somewhere to send events.
  - name: falco
    url: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0
    namespace: falco
    labels:
      service: foundational
    valuesPath: foundational/security/falco/non-prod/values.yaml

  # ---- observability --------------------------------------------------------
  # Alloy is the whole observability stack: no self-hosted Prometheus or Grafana,
  # everything ships to Grafana Cloud.
  #
  # It will not become Healthy until the secret store holds a grafana-cloud entry
  # (prometheus-url, prometheus-username, loki-url, loki-username, api-token).
  # Leave it unsynced until then rather than running a collector that cannot
  # authenticate.
  #
  # The cluster label has to be inline: a values file fetched from git gets no
  # per-cluster substitution, because the generator only expands the ApplicationSet
  # template. Inline values also win over valueFiles, which is what makes the pair
  # work together.
  - name: grafana-alloy
    url: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.0
    namespace: grafana-alloy
    labels:
      service: foundational
    valuesPath: foundational/observability/grafana-alloy/non-prod/values.yaml
    values: |
      alloy:
        extraEnv:
          - name: CLUSTER_NAME
            value: "{{short}}"

  # Alloy's credentials. Separate app from the collector itself so the secret
  # lands before the DaemonSet needs it, and so rotating a Grafana Cloud token
  # is a sync of this alone.
  #
  # The five properties are what Grafana Cloud gives you: a Prometheus
  # remote_write endpoint and its numeric instance id, the same pair for Loki,
  # and one Access Policy token used as the password for both.
  - name: grafana-alloy-manifests
    appLabel: grafana-alloy
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    targetRevision: v2.1.0
    namespace: grafana-alloy
    labels:
      service: foundational
    values: |
      externalSecrets:
        - secretName: grafana-cloud
          namespace: grafana-alloy
          refreshInterval: 1h
          data:
            - {secretKey: prometheus-url, remoteRef: {key: grafana-cloud, property: prometheus-url}}
            - {secretKey: prometheus-username, remoteRef: {key: grafana-cloud, property: prometheus-username}}
            - {secretKey: loki-url, remoteRef: {key: grafana-cloud, property: loki-url}}
            - {secretKey: loki-username, remoteRef: {key: grafana-cloud, property: loki-username}}
            - {secretKey: api-token, remoteRef: {key: grafana-cloud, property: api-token}}

  - name: local-path-provisioner
    url: git@github.com:polarpoint-io/argocd-applications.git
    path: foundational/common/local-path-provisioner/non-prod
    namespace: local-path-storage
    labels:
      service: foundational
    values: |
      storageClass:
        create: true
        defaultClass: true
        name: local-path

      # The operator registers itself in the tailnet under a per-cluster hostname,
      # which is the only thing that varies across the three.
  - name: tailscale-operator
    url: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.98.4
    namespace: tailscale
    labels:
      service: foundational
    values: |
      operatorConfig:
        defaultTags:
          - tag:k8s
        hostname: tailscale-operator-{{short}}-non-prod
      oauth: {}   # supplied via the operator-oauth secret (ExternalSecret below)

  - name: tailscale-operator-manifests
    appLabel: tailscale-operator
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    namespace: tailscale
    labels:
      service: foundational

    # Nothing here. Foundational is expressed as applicationSets above, because
    # every one of these components belongs on every cluster.
    targetRevision: v2.1.0
    values: |
      externalSecrets:
        - secretName: operator-oauth
          namespace: tailscale
          refreshInterval: 1m
          data:
            - {secretKey: client_id, remoteRef: {key: tailscale-oauth, property: client_id}}
            - {secretKey: client_secret, remoteRef: {key: tailscale-oauth, property: client_secret}}
  applications: []

- name: controller
  permissions:
    admin:
      description: "Admin Access"
      groups:
      - polarpoint-argocd-admin
    rw:
      description: "Read-Write Access"
      groups:
      - polarpoint-argocd-rw
    ro:
      description: "Read-Only Access"
      groups:
      - polarpoint-argocd-ro
  destinations:
  - name: default
    namespace: "*"
    server: https://kubernetes.default.svc
  applications:

  - name: backstage-manifests-non-prod
    appLabel: backstage
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    namespace: platform
    labels:
      service: platform
    targetRevision: v2.1.0
    values: |
      certificates:
        - name: platform-tls
          namespace: platform
          host: platform.polarpoint.io
      externalSecrets:
        - secretName: backstage-database-authentication
          namespace: platform
          refreshInterval: 5m
          data:
            - {secretKey: POSTGRES_USER, remoteRef: {key: backstage, property: postgres-user}}
            - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: backstage, property: postgres-password}}
            - {secretKey: POSTGRES_PORT, remoteRef: {key: backstage, property: postgres-port}}
        - secretName: backstage-db
          namespace: platform
          refreshInterval: 5m
          data:
            - {secretKey: postgres-password, remoteRef: {key: backstage, property: postgres-password}}
            - {secretKey: password, remoteRef: {key: backstage, property: postgres-password}}
            - {secretKey: user-password, remoteRef: {key: backstage, property: postgres-password}}
            - {secretKey: admin-password, remoteRef: {key: backstage, property: postgres-password}}
        - secretName: backstage-github-authentication
          namespace: platform
          refreshInterval: 5m
          data:
            - {secretKey: AUTH_GITHUB_CLIENT_ID, remoteRef: {key: backstage, property: github-client-id}}
            - {secretKey: AUTH_GITHUB_CLIENT_SECRET, remoteRef: {key: backstage, property: github-client-secret}}
            - {secretKey: GITHUB_APP_ID, remoteRef: {key: backstage, property: github-app-id}}
            - {secretKey: GITHUB_APP_PRIVATE_KEY, remoteRef: {key: backstage, property: github-app-private-key}}
            - {secretKey: GITHUB_APP_WEBHOOK_SECRET, remoteRef: {key: backstage, property: github-app-webhook-secret}}
        - secretName: backstage-kubernetes-authentication
          namespace: platform
          refreshInterval: 5m
          data:
            - {secretKey: K8S_TOKEN, remoteRef: {key: backstage, property: kubernetes-tooling-token}}
            - {secretKey: K8S_URL, remoteRef: {key: backstage, property: kubernetes-tooling-url}}
            - {secretKey: K8S_CONTROLLER_TOKEN, remoteRef: {key: backstage, property: kubernetes-controller-token}}
            - {secretKey: K8S_CONTROLLER_URL, remoteRef: {key: backstage, property: kubernetes-controller-url}}
      tlsProxies:
        - name: platform
          namespace: platform
          host: platform.polarpoint.io
          certSecret: platform-tls
          maxBodySize: 100m
          routes:
            - {path: "/", upstream: "http://backstage:7007", websocket: true, forwardedHost: false}
      customResources:
        - apiVersion: v1
          kind: ServiceAccount
          metadata: {name: backstage-controller-viewer, namespace: platform}
        - apiVersion: v1
          kind: Secret
          metadata:
            name: backstage-controller-viewer-token
            namespace: platform
            annotations: {kubernetes.io/service-account.name: backstage-controller-viewer}
          type: kubernetes.io/service-account-token
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata: {name: backstage-controller-viewer}
          rules:
            - apiGroups: ['*']
              resources: ['*']
              verbs: ['get', 'list', 'watch']
            - nonResourceURLs: ['*']
              verbs: ['get']
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata: {name: backstage-controller-viewer}
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: backstage-controller-viewer
          subjects:
            - kind: ServiceAccount
              name: backstage-controller-viewer
              namespace: platform
  - name: backstage-non-prod
    appLabel: backstage
    url: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.2
    namespace: platform
    labels:
      service: platform
    values: "fullnameOverride: backstage\n\nglobal:\n  security:\n    allowInsecureImages: true\n\nbackstage:\n  image:\n    registry: ghcr.io\n    repository: polarpoint-io/backstage\n    tag: \"latest\"\n    pullPolicy: Always\n  containerPorts:\n    backend: 7007\n  command: [\"node\", \"packages/backend\"]\n  args: [\"--config\", \"app-config.yaml\", \"--config\", \"app-config.production.yaml\"]\n  extraEnvVars:\n    - name: POSTGRES_HOST\n      value: backstage-postgresql\n  extraEnvVarsSecrets:\n    - backstage-database-authentication\n    - backstage-kubernetes-authentication\n    - backstage-github-authentication\n  # app-config.yaml / app-config.production.yaml are baked into the image\n  # (see args above) — do NOT mount the old RKE1-era backstage-app-config\n  # ConfigMap over them, it silently shadows every config change baked\n  # into new image builds.\n\npostgresql:\n  enabled: true\n  fullnameOverride: backstage-postgresql\n  image:\n    repository: bitnamilegacy/postgresql\n  auth:\n    username: backstage\n    database: backstage\n    existingSecret: backstage-db\n  primary:\n    persistence:\n      size: 8Gi\n"
  - name: crossplane-manifests-non-prod
    appLabel: crossplane-manifests
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    namespace: iac
    labels:
      service: controller
    targetRevision: v2.1.0
    values: |
      externalSecrets:
        - secretName: aws-credentials
          namespace: iac
          refreshInterval: 5m
          annotations: {argocd.argoproj.io/sync-wave: "2"}
          template:
            data:
              credentials: |
                [default]
                aws_access_key_id = {{ .accessKeyId }}
                aws_secret_access_key = {{ .secretAccessKey }}
          data:
            - {secretKey: accessKeyId, remoteRef: {key: aws-credentials, property: access-key-id}}
            - {secretKey: secretAccessKey, remoteRef: {key: aws-credentials, property: secret-access-key}}
      customResources:
        - apiVersion: pkg.crossplane.io/v1beta1
          kind: Function
          metadata:
            name: function-patch-and-transform
            annotations: {argocd.argoproj.io/sync-wave: "1"}
          spec:
            package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
            packagePullPolicy: IfNotPresent
            revisionActivationPolicy: Automatic
        - apiVersion: pkg.crossplane.io/v1
          kind: Provider
          metadata:
            name: upbound-provider-family-aws
            annotations: {argocd.argoproj.io/sync-wave: "1"}
          spec:
            package: xpkg.upbound.io/upbound/provider-family-aws:v1.18.0
            packagePullPolicy: IfNotPresent
            revisionActivationPolicy: Automatic
        - apiVersion: aws.upbound.io/v1beta1
          kind: ProviderConfig
          metadata:
            name: default
            annotations: {argocd.argoproj.io/sync-wave: "3"}
          spec:
            credentials:
              source: Secret
              secretRef: {namespace: iac, name: aws-credentials, key: credentials}
  - name: crossplane-non-prod
    appLabel: crossplane
    url: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.3.4
    namespace: iac
    labels:
      service: controller
    values: |
      replicas: 1

      provider:
        packages: []

      configuration:
        packages: []

      metrics:
        enabled: false

      resourcesCrossplane:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
  - name: kargo-manifests-non-prod
    appLabel: kargo
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    namespace: kargo
    labels:
      service: controller
    targetRevision: v2.1.0
    values: |
      certificates:
        - name: kargo-api-tls
          namespace: kargo
          host: promote.polarpoint.io
      externalSecrets:
        - secretName: kargo-api-secret
          namespace: kargo
          refreshInterval: 5m
          data:
            - {secretKey: ADMIN_ACCOUNT_PASSWORD_HASH, remoteRef: {key: kargo, property: admin-password-hash}}
            - {secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY, remoteRef: {key: kargo, property: admin-token-signing-key}}
  - name: kargo-projects-non-prod
    appLabel: kargo
    url: git@github.com:polarpoint-io/argocd-applications.git
    path: platform-engineering/kargo-projects/non-prod
    namespace: kargo
    labels:
      service: controller
  - name: kargo-non-prod
    appLabel: kargo
    url: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.11.0
    namespace: kargo
    labels:
      service: controller
    values: |
      api:
        host: promote.polarpoint.io
        secretManagementEnabled: true
        secret:
          name: kargo-api-secret     # ESO-managed - see kargo-manifests
        tls:
          enabled: true
          selfSignedCert: false
          secretName: kargo-api-tls  # cert-manager Certificate - see kargo-manifests
        service:
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: promote
        argocd:
          urls:
            "": https://deploy.polarpoint.io
  - name: mongostate-crossplane-non-prod
    appLabel: mongostate-crossplane
    url: git@github.com:polarpoint-io/mongostate-crossplane.git
    path: manifests
    namespace: crossplane-system
    labels:
      service: controller
  - name: psmdb-operator-crds-non-prod
    appLabel: psmdb-operator
    url: https://percona.github.io/percona-helm-charts/
    chart: psmdb-operator-crds
    targetRevision: 1.23.0
    namespace: psmdb-operator
    labels:
      service: controller
  - name: psmdb-operator-non-prod
    appLabel: psmdb-operator
    url: https://percona.github.io/percona-helm-charts/
    chart: psmdb-operator
    targetRevision: 1.23.0
    namespace: psmdb-operator
    labels:
      service: controller
    values: |
      watchAllNamespaces: true

- name: tooling
  permissions:
    admin:
      description: "Admin Access"
      groups:
      - polarpoint-argocd-admin
    rw:
      description: "Read-Write Access"
      groups:
      - polarpoint-argocd-rw
    ro:
      description: "Read-Only Access"
      groups:
      - polarpoint-argocd-ro
  destinations:
  - name: default
    namespace: "*"
    server: https://kubernetes.default.svc
  - name: tooling
    namespace: "*"
    server: https://192.168.11.80:6443
      # Workloads that have to run on multitenant belong here, not in the
      # foundational project - foundational is for the per-cluster baseline
      # every cluster gets (cert-manager, external-secrets, tailscale-operator,
      # the observability and security stacks), not for one-off applications
      # that happen to need a particular cluster.
  - name: multitenant
    namespace: "*"
    server: https://192.168.11.63:6443
  applications:

  - name: ciso-assistant-manifests-non-prod
    appLabel: ciso-assistant
    url: git@github.com:polarpoint-io/helm-library-manifests.git
    path: .
    targetRevision: v2.1.0
    namespace: ciso-assistant
    targetCluster: https://192.168.11.80:6443
    labels:
      service: tooling
    values: |
      global:
        secretStore:
          name: cluster-secrets-store
          kind: ClusterSecretStore
        issuer: letsencrypt-dns01

      externalSecrets:
        - secretName: ciso-assistant-db
          namespace: ciso-assistant
          refreshInterval: 5m
          data:
            - secretKey: postgres-password
              remoteRef: {key: ciso-assistant, property: db-password}
            # bitnami's postgres chart reads `password`; the app reads
            # `postgres-password`. Same value under two keys, deliberately.
            - secretKey: password
              remoteRef: {key: ciso-assistant, property: db-password}

        - secretName: ciso-assistant-django
          namespace: ciso-assistant
          refreshInterval: 5m
          data:
            - secretKey: django-secret-key
              remoteRef: {key: ciso-assistant, property: django-secret-key}

      certificates:
        - name: grc-tls
          namespace: ciso-assistant
          host: grc.polarpoint.io

      tlsProxies:
        - name: grc
          namespace: ciso-assistant
          host: grc.polarpoint.io
          certSecret: grc-tls
          # This app's Set-Cookie/session headers overflow nginx's default
          # buffers, which surfaced as a 502 on /login rather than anything
          # pointing at buffers.
          largeHeaders: true
          # Mirrors upstream's own Caddy routing: /api/* to the backend,
          # everything else to the frontend.
          routes:
            - {path: "/api/", upstream: "http://ciso-assistant-backend:80"}
            - {path: "/", upstream: "http://ciso-assistant-frontend:80", websocket: true}
